# Notfallkarte — static files behind your reverse proxy.
#
# Create the shared network once, or reuse the one your reverse proxy already
# has, then bring it up:
#
#   docker network create proxy-network
#   cp .env.example .env
#   docker compose up -d --build
#
# Nothing is published to the host. The proxy reaches this container by name
# over PROXY_NETWORK, so the port only has to be free inside the container.
#
#   Nginx Proxy Manager: forward hostname ${CONTAINER_NAME}, port 8080,
#   scheme http — with the NPM container attached to PROXY_NETWORK too.
#   Plain nginx on the same network: proxy_pass http://notfallkarte:8080;
#
# No reverse proxy on this host? Uncomment `ports:` below and the page is
# served on HTTP_PORT directly (plain http — put TLS in front of it before
# sharing the link: the PKCE exchange and the server address it remembers
# deserve https).
#
# Variables are written out rather than read through `env_file:` so this works
# unchanged under Portainer, which passes stack variables as environment and
# writes no .env of its own. The CLI reads ./.env for these automatically.

services:
  web:
    build: .
    image: ${IMAGE:-notfallkarte:latest}
    container_name: ${CONTAINER_NAME:-notfallkarte}
    restart: unless-stopped
    # ports:
    #   - "${HTTP_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      # nginx writes its pid, temp files and the rendered templates here.
      - /var/cache/nginx
      - /var/run
      - /etc/nginx/conf.d
    networks:
      - proxy

networks:
  # Shared with the reverse proxy, and created outside this file so several
  # stacks can sit on it.
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy-network}
